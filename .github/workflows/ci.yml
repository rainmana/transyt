name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      # These integration tests launch the same optimized binary that is uploaded.
      - run: cargo test --locked --release
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo about generate --locked --fail about.hbs --output-file DEPENDENCY_LICENSES.md
      - name: Stage test binary and notices
        shell: bash
        run: |
          mkdir -p dist
          binary=target/release/transyt
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          cp "$binary" LICENSE THIRD_PARTY_NOTICES.md DEPENDENCY_LICENSES.md README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: transyt-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
  worker:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --locked --lib --target wasm32-unknown-unknown
      - run: cargo install worker-build --locked --version 0.9.0
      - run: worker-build --release
  coverage:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --locked --all-targets --lcov --output-path lcov.info --fail-under-lines 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: lcov.info
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command-arguments: licenses sources
