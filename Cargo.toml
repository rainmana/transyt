[package]
name = "transyt"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Credential-free YouTube transcripts for MCP agents"
repository = "https://github.com/rainmana/transyt"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
regex = "1"
roxmltree = "0.21"
html-escape = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net"] }
axum = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.9"

[[bin]]
name = "transyt"
path = "src/main.rs"
